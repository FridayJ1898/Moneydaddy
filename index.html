<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>머니대디 경제 인사이트 포털</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- MathJax 수식 렌더링 지원 -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <!-- Caveat 손글씨 폰트 추가 로드 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        /* ── 모던 디자인 토큰 시스템 ── */
        :root {
            --md-primary: #0ea5e9;
            --md-primary-dark: #0284c7;
            --md-primary-light: #7dd3fc;
            --md-accent: #f59e0b;
            --md-accent-dark: #d97706;
            --md-success: #10b981;
            --md-danger: #ef4444;
            
            --md-bg-base: #0a0e17;
            --md-bg-elevated: #141824;
            --md-bg-card: rgba(255, 255, 255, 0.03);
            
            --md-text-primary: #f1f5f9;
            --md-text-secondary: #cbd5e1;
            --md-text-tertiary: #94a3b8;

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-full: 999px;

            --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.25);
            --shadow-card-hover: 0 12px 28px rgba(14, 165, 233, 0.15);
            --shadow-glow: 0 0 25px rgba(14, 165, 233, 0.2);
            --shadow-warm-glow: 0 0 30px rgba(245, 158, 11, 0.08);

            --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif; background-color: var(--md-bg-base); color: var(--md-text-secondary); overflow-x: hidden; }
        .font-serif-essay { font-family: 'Lora', Georgia, Cambria, serif; }

        /* 손글씨 감성 폰트 클래스 */
        .quote-handwritten { font-family: 'Caveat', cursive; font-size: 1.25rem; color: var(--md-accent); }

        /* 글래스모피즘 프리미엄 카드 */
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow-card);
        }

        /* ── 사이드바 ── */
        .sidebar-fixed-width { width: 280px; min-width: 280px; max-width: 280px; flex-shrink: 0; }
        .sidebar-drawer { transform: translateX(-100%); transition: transform 0.28s cubic-bezier(.4,0,.2,1); position: fixed; inset-y: 0; left: 0; z-index: 50; width: 280px; background: var(--md-bg-base); }
        .sidebar-drawer.open { transform: translateX(0); }
        @media (min-width: 1024px) { .sidebar-drawer { transform: none; position: static; } }wer { transform: none; position: static; } }

        /* ── 글 목록 항목 ── */
        .post-item { border-left: 2px solid transparent; transition: border-color .2s, background .2s; }
        .post-item:hover { border-color: var(--theme-color); background: rgba(255,255,255,.03); }
        .post-item.active { border-color: var(--theme-color); background: rgba(255,255,255,.05); }

        /* ── 메인 컨텐츠 카드 ── */
        .post-card { background: var(--md-bg-card); border: 1px solid rgba(255,255,255,.06); border-radius: var(--radius-md); transition: all var(--transition-base); }
        .post-card:hover { border-color: var(--theme-color); transform: translateY(-3px) scale(1.01); box-shadow: var(--shadow-card-hover); }

        /* ── 타이포 계층 ── */
        .t-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--md-text-tertiary); }
        .t-title { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.03em; line-height: 1.25; color: var(--md-text-primary); }
        .t-sub { font-size: .875rem; font-weight: 500; color: var(--md-text-secondary); line-height: 1.6; }
        .t-body { font-size: .9rem; line-height: 1.85; color: var(--md-text-secondary); }
        .t-caption { font-size: .75rem; color: var(--md-text-tertiary); }

        /* 숫자 강조용 */
        .numeric-emphasis { font-family: 'JetBrains Mono', 'Roboto Mono', monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

        /* ── 테마 트랜지션 ── */
        .theme-transition { transition: color .4s ease, border-color .4s ease, background-color .4s ease; }

        /* ── 애니메이션 ── */
        .fade-in { animation: fadeIn .35s ease-out; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

        /* ── 모바일 오버레이 ── */
        .mobile-menu-overlay { background: rgba(10,14,23,.85); backdrop-filter: blur(8px); display: none; position: fixed; inset: 0; z-index: 40; }
        .mobile-menu-overlay.open { display: block; }

        /* ── 스크롤바 ── */
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }

        /* ── 채널 컬러 ── */
        .youtube-color { background: #FF0000; }
        .blog-color { background: #03C75A; }

        /* ── 차트 ── */
        .chart-container { position: relative; width: 100%; height: 260px; }
        @media (min-width: 768px) { .chart-container { height: 360px; } }

        /* ── 리포트 본문 (다크 통일) ── */
        .report-content { color: var(--md-text-secondary); }
        .report-content p { margin-bottom: 1.2rem; line-height: 1.85; }
        .report-content h3 { margin-top: 2.2rem; margin-bottom: .75rem; font-weight: 700; color: var(--md-text-primary); border-left: 3px solid var(--theme-color); padding-left: .75rem; font-size: 1.05rem; }
        .report-content b, .report-content strong { color: var(--md-text-primary); }

        /* ── 모바일 하단 탭 안전 영역 ── */
        @media (max-width: 1023px) { #main-content { padding-bottom: 5rem; } }

        /* ── 다크 오버라이드 ── */
        .article-wrap { background: var(--md-bg-base) !important; color: var(--md-text-secondary) !important; }
        .article-wrap * { color: inherit; }
        .article-wrap h1, .article-wrap h2 { color: var(--md-text-primary) !important; }
        .article-wrap p  { color: var(--md-text-secondary) !important; }
        .article-wrap b, .article-wrap strong { color: var(--md-text-primary) !important; }
        .article-wrap li { color: var(--md-text-secondary) !important; }
        /* 테이블 다크 오버라이드 */
        .article-wrap table  { border-color: rgba(255,255,255,.06) !important; }
        .article-wrap thead  { background: rgba(255,255,255,.04) !important; }
        .article-wrap th     { color: var(--md-text-tertiary) !important; }
        .article-wrap td     { border-color: rgba(255,255,255,.04) !important; color: var(--md-text-secondary) !important; }
        .article-wrap tr:nth-child(even) { background: rgba(255,255,255,.01) !important; }
        /* 요약 카드 다크 */
        .article-wrap .summary-card { background: rgba(255,255,255,.03) !important; border-color: rgba(255,255,255,.08) !important; border-radius: var(--radius-lg); }
        .article-wrap .summary-card p { color: var(--md-text-secondary) !important; }
        /* 관련 콘텐츠 유도 다크 */
        .article-wrap .related-block { background: rgba(255,255,255,.03) !important; border-radius: var(--radius-md); }
        
        /* 백과사전 및 대시보드 라이트 카드 배경 다크모드로 리셋 */
        .article-wrap .bg-white,
        .article-wrap .bg-slate-50,
        .article-wrap .bg-slate-100,
        .article-wrap .bg-slate-200,
        .article-wrap .dictionary-card {
            background-color: var(--md-bg-elevated) !important;
            background: var(--md-bg-elevated) !important;
            border-color: rgba(255, 255, 255, 0.06) !important;
            color: var(--md-text-secondary) !important;
        }
        .article-wrap .bg-slate-50 p,
        .article-wrap .bg-slate-100 p,
        .article-wrap .bg-slate-50 span,
        .article-wrap .bg-slate-100 span,
        .article-wrap .dictionary-card p {
            color: var(--md-text-secondary) !important;
        }
        .article-wrap .dictionary-card h3,
        .article-wrap .dictionary-card span.text-slate-900,
        .article-wrap .dictionary-card span.text-slate-700 {
            color: var(--md-text-primary) !important;
        }
        .article-wrap button.border-slate-100 {
            border-color: rgba(255, 255, 255, 0.08) !important;
            color: var(--md-text-secondary) !important;
        }
        .article-wrap button.border-slate-100:hover {
            background-color: rgba(255, 255, 255, 0.02) !important;
        }

        /* ── 브레드크럼 ── */
        .breadcrumb-bar {
            position: sticky; top: 0; z-index: 30;
            background: rgba(10,14,23,.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,.06);
            padding: .75rem 1.25rem;
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
        }
        .breadcrumb-bar .back-btn {
            display: flex; align-items: center; gap: .5rem;
            font-size: .75rem; font-weight: 700; color: var(--md-text-tertiary);
            cursor: pointer; transition: color .15s;
            background: none; border: none; padding: 0;
        }
        .breadcrumb-bar .back-btn:hover { color: var(--md-text-primary); }
        .breadcrumb-bar .post-cat {
            font-size: .65rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: .08em; padding: .25rem .625rem;
            border-radius: 999px; border: 1px solid rgba(255,255,255,.1);
            color: var(--theme-color);
        }

        /* ── 모바일 가독성 최적화 패치 (0.9rem -> 1rem) ── */
        @media (max-width: 768px) {
            .article-wrap p, .article-wrap li {
                font-size: 1rem !important;
                line-height: 1.85 !important;
            }
            .article-wrap table {
                display: block;
                width: 100% !important;
            }
            .article-wrap thead {
                display: none;
            }
            .article-wrap tbody, .article-wrap tr, .article-wrap td {
                display: block;
                width: 100% !important;
            }
            .article-wrap tr {
                margin-bottom: 1rem;
                border: 1px solid rgba(255,255,255,.08) !important;
                border-radius: var(--radius-md);
                padding: 0.75rem !important;
                background: rgba(255,255,255,.02) !important;
            }
            .article-wrap td {
                border: none !important;
                padding: 0.4rem 0.2rem !important;
                display: flex;
                justify-content: space-between;
                font-size: 0.875rem !important;
            }
            .article-wrap td::before {
                content: attr(data-label);
                font-weight: 700;
                color: var(--md-text-tertiary);
                margin-right: 1rem;
            }
        }

        /* 프로필 영웅화 및 감성 글로우 */
        .author-hero {
            padding: 1.25rem;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.08) 0%, rgba(245, 158, 11, 0.08) 100%);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(245, 158, 11, 0.12);
            box-shadow: var(--shadow-warm-glow);
        }
        .author-avatar {
            width: 56px;
            height: 56px;
            border: 3px solid var(--md-accent);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
            transition: all var(--transition-base);
        }
        .author-avatar:hover {
            transform: rotate(5deg) scale(1.08);
        }

        /* 브랜드 로고 */
        .logo-enhanced {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 2px 6px rgba(245, 158, 11, 0.3));
        }
        .brand-main {
            font-size: 16px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--md-primary), var(--md-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 페이월 오버레이 동적 스크롤 트리거 */
        .paywall-overlay {
            display: none;
            width: 100%;
            margin-top: -150px;
            position: relative;
            z-index: 20;
            background: linear-gradient(to top, var(--md-bg-base) 60%, transparent 100%);
            padding: 6rem 0 3rem;
        }
        .paywall-overlay.active {
            display: block;
        }
    </style>
</head>

        // ── localStorage 기반 조회수 증가 로직 ──
        function incrementViews(postId) {
            const key = `viewed_${postId}`;
            if (!localStorage.getItem(key)) {
                localStorage.setItem(key, 'true');
                const post = POSTS_DATABASE.find(p => p.id === postId);
                if (post) {
                    post.views = (post.views || 0) + 1;
                }
            }
        }

        // ── 70% 스크롤 감지 페이월 트리거 ──
        function initScrollPaywall(scrollEl, paywallEl) {
            // 로컬 테스트(file://) 환경이거나, localStorage에 Pro/Owner 권한이 활성화된 경우 페이월 작동 우회
            if (location.protocol === 'file:' || localStorage.getItem('isPro') === 'true' || localStorage.getItem('isOwner') === 'true') {
                return;
            }

            let paywallShown = false;
            
            scrollEl.onscroll = () => {
                const totalScrollable = scrollEl.scrollHeight - scrollEl.clientHeight;
                if (totalScrollable <= 100) return; // 스크롤할 분량이 극히 적은 글은 우회
                
                const scrolled = scrollEl.scrollTop / totalScrollable;
                if (scrolled > 0.65 && !paywallShown) {
                    paywallEl.classList.add('active');
                    // 글 아래 본문 블러 처리
                    const wrapEl = scrollEl.querySelector('.article-wrap');
                    if (wrapEl) {
                        wrapEl.classList.add('filter', 'blur-[2px]', 'pointer-events-none', 'select-none', 'opacity-30');

        // ── 북마크 / 공유 모조 함수 ──
        function toggleBookmark(id) {
            const btn = document.getElementById(`btn-bm-${id}`);

        function sharePost(title) {
            navigator.clipboard.writeText(window.location.href);
            alert(`클립보드에 링크가 복사되었습니다:\n"${title}"`);
        }

        // ── 다크 테마 DOM 정제 ──
        // CSS!important로 쪼이지 않는 인라인 스타일만 선택적으로 쪼습니다.
        function applyDarkOverride(root) {
            // 1. 다크 bg로 바꿴야 할 하이라이트 패턴
            const BRIGHT_BG = ['#ffffff','#f8fafc','#f1f5f9','#f0f9ff','#fafafa'];
            const BRIGHT_TEXT = ['#0f172a','#1e293b','#1e3a5f','#0a0f1d','#374151','#111827','#475569','#4b5563','#64748b'];

            root.querySelectorAll('[style]').forEach(el => {
                const s = el.style;

                // 그라데이션(gradient)을 포함하는 배경 스타일은 삭제하지 않고 우회 보존
                const bgText = (s.background || '').toLowerCase();
                const isGradient = bgText.includes('gradient') || bgText.includes('linear-');

                if (!isGradient) {
                    // 밝은 bg 제거
                    if (s.background && BRIGHT_BG.some(c => s.background.toLowerCase().includes(c.toLowerCase()))) {
                        s.background = 'rgba(255,255,255,.02)';
                        s.borderColor = 'rgba(255,255,255,.05)';
                    }
                    if (s.backgroundColor && BRIGHT_BG.some(c => s.backgroundColor.toLowerCase().includes(c.toLowerCase()))) {
                        s.backgroundColor = 'rgba(255,255,255,.02)';
                    }
                }

                // 어두운 텍스트 색상을 다크모드용 밝은 텍스트로 적극 치환
                if (s.color && BRIGHT_TEXT.some(c => s.color.toLowerCase().includes(c))) {
                    s.color = '#e2e8f0';
                }

                // 브라이트 border-color
                if (s.borderColor && (s.borderColor.includes('#e2e8f0') || s.borderColor.includes('#f1f5f9') || s.borderColor.includes('#e5e7eb'))) {
                    el.style.borderColor = 'rgba(255,255,255,.08)';

                        </div>
                        <p style="color:#475569; line-height:1.8; margin-bottom:1rem;">2026년 글로벌 채권시장은 인플레이션의 질긴 잔존과 통화정책 패러다임 전환이 맞물리며 장기금리가 구조적인 고공행진을 지속하는 변동성 장세에 직면해 있다. 미국 10년물 국채금리는 연초 인플레이션 완화 기대감에 힘입어 4.0% 영역까지 하락 조정을 겪기도 했으나, 6월 말 기준 <b>4.37% 안팎</b>으로 반등하며 고금리 장기화의 지지선이 견고함을 보였다. 이에 민감한 2년물 국채금리 역시 4.08% 선을 기록하고 있다.</p>
                        
                        <p style="color:#475569; line-height:1.8; margin-bottom:1rem;">이러한 글로벌 고금리 환경의 중심에는 신임 연준 의장 <b>케빈 워시(Kevin Warsh)</b>의 취임과 함께 단행된 연준의 소통 방식 개혁이 자리 잡고 있다. 연준은 2026년 6월 FOMC에서 기준금리를 <b>3.50%~3.75%</b> 범위로 만장일치 동결했으나, 점도표(Dot Plot) 작성을 거부하는 등 선제 안내(Forward Guidance)를 대폭 축소했다. 아울러 위원 18명 중 9명이 연내 최소 1회 이상의 추가 금리 인상을 전망하면서 시장의 조기 인하 기대감은 사실상 소멸되었고 장기 기간 프리미엄(Term Premium) 상승을 유발했다.</p>

                    datasets: tickers.map((t, i) => ({
