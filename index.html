<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>머니대디 경제 인사이트 포털</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- MathJax 수식 렌더링 지원 -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    
    <!-- Google Web Fonts (Noto Sans KR, Plus Jakarta Sans, Lora, Caveat, JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Caveat:wght@700&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- MoneyDaddy Design System Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="antialiased min-h-screen flex flex-col lg:flex-row overflow-x-hidden">

    <!-- 상단 Reading Progress Bar -->
    <div id="reading-progress-bar" class="fixed top-0 left-0 h-1 bg-gradient-to-r from-blue-500 via-emerald-400 to-amber-400 z-50 transition-all duration-75 pointer-events-none" style="width: 0%;"></div>

    <!-- 모바일 탑 헤더 바 -->
    <header class="lg:hidden bg-[#0a0e17]/95 backdrop-blur-md border-b border-white/[.06] px-5 h-14 flex items-center justify-between sticky top-0 z-40">
        <div class="logo-enhanced cursor-pointer" onclick="goHome()">
            <svg viewBox="0 0 40 40" class="logo-icon">
                <path d="M10,30 L10,15 L20,25 L30,15 L30,30" stroke="#f59e0b" stroke-width="3" fill="none"/>
                <circle cx="20" cy="12" r="5" fill="#0ea5e9" opacity="0.4"/>
            </svg>
            <div class="flex flex-col">
                <span class="brand-main">머니대디</span>
                <span class="text-[7px] tracking-widest text-slate-500 font-bold leading-none">MONEY DADDY</span>
            </div>
        </div>
        <button onclick="toggleMobileMenu()" aria-label="전체 목록" class="w-9 h-9 flex items-center justify-center rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
    </header>

    <!-- 모바일 드로어 배경 오버레이 -->
    <div id="mobile-overlay" class="mobile-menu-overlay lg:hidden" onclick="toggleMobileMenu()"></div>

    <!-- 사이드바 네비게이션 드로어 -->
    <aside id="sidebar" class="sidebar-drawer lg:sidebar-fixed-width flex flex-col h-full lg:h-screen border-r border-white/[.06] bg-[#0a0e17]">
        <!-- 브랜드 및 로고 헤더 (데스크톱 전용) -->
        <div class="px-5 py-4.5 border-b border-white/[0.06] hidden lg:block">
            <div class="logo-enhanced cursor-pointer" onclick="goHome()">
                <svg viewBox="0 0 40 40" class="logo-icon">
                    <path d="M10,30 L10,15 L20,25 L30,15 L30,30" stroke="#f59e0b" stroke-width="3" fill="none"/>
                    <circle cx="20" cy="12" r="5" fill="#0ea5e9" opacity="0.4"/>
                </svg>
                <div class="flex flex-col">
                    <span class="brand-main">머니대디 Insight</span>
                    <span class="text-[7px] tracking-widest text-slate-500 font-bold leading-none mt-0.5">TRUST & INVESTMENT</span>
                </div>
            </div>
        </div>

        <!-- 작성자 프로필 영웅화 카드 -->
        <div class="p-4 border-b border-white/[.06]">
            <div class="author-hero">
                <div class="flex items-center gap-3">
                    <div class="author-avatar rounded-full bg-gradient-to-tr from-blue-600 to-emerald-500 flex items-center justify-center text-white font-black text-xs shadow-md">MD</div>
                    <div class="flex-grow">
                        <div class="flex items-center justify-between">
                            <p class="font-black text-slate-100 text-xs">머니대디</p>
                            <span class="text-[8px] px-1.5 py-0.5 bg-amber-500/10 text-amber-400 rounded-full font-bold">금융 15년</span>
                        </div>
                        <p class="text-[9.5px] text-slate-400 mt-0.5 leading-snug">아빠가 되며 깨달은 '진짜 투자 철학'</p>
                    </div>
                </div>
                <div class="flex justify-between mt-3 text-[10px] text-slate-400 gap-1.5 pt-2 border-t border-white/[0.04]">
                    <a href="https://www.youtube.com/@%EB%A8%B8%EB%8B%88%EB%8C%80%EB%94%94" target="_blank" class="flex-1 text-center py-1.5 bg-white/[0.03] hover:bg-white/[0.08] hover:text-slate-200 rounded transition-all">📺 유튜브</a>
                    <a href="https://blog.naver.com/jasonmoneylogin" target="_blank" class="flex-1 text-center py-1.5 bg-white/[0.03] hover:bg-white/[0.08] hover:text-slate-200 rounded transition-all">📝 블로그</a>
                    <button onclick="alert('카카오톡 오픈챗은 곧 공개됩니다!')" class="flex-1 text-center py-1.5 bg-white/[0.03] hover:bg-white/[0.08] hover:text-slate-200 rounded transition-all">💬 카톡</button>
                </div>
            </div>
        </div>

        <!-- 데스크톱 카테고리 탭 -->
        <div class="hidden lg:flex px-3 py-2 border-b border-white/[.06] gap-1">
            <button onclick="switchCategory('macro')" data-category="macro" class="cat-tab flex-1 py-2 rounded-md text-[11px] font-semibold transition-all text-slate-500 hover:text-white">📈 거시금융</button>
            <button onclick="switchCategory('tech')" data-category="tech" class="cat-tab flex-1 py-2 rounded-md text-[11px] font-semibold transition-all text-slate-500 hover:text-white">⚙️ 테크·ETF</button>
            <button onclick="switchCategory('essay')" data-category="essay" class="cat-tab flex-1 py-2 rounded-md text-[11px] font-semibold transition-all text-slate-500 hover:text-white">📚 백과·에세이</button>
        </div>

        <!-- 검색창 및 정렬 드롭다운 -->
        <div class="px-3 py-2 border-b border-white/[.06] flex flex-col gap-1.5">
            <input type="search" id="search-input" placeholder="🔍 키워드 검색 (예: ETF, 금리)" oninput="handleSearch(this.value)" class="w-full h-8 bg-white/[0.05] border border-white/[0.08] rounded-md px-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-all">
            <select id="sort-select" onchange="handleSort(this.value)" class="w-full h-8 bg-[#0a0e17] border border-white/[0.08] rounded-md px-2 text-xs text-slate-400 focus:outline-none focus:border-blue-500 transition-all">
                <option value="latest">최신순</option>
                <option value="views">인기 조회순</option>
            </select>
        </div>

        <!-- 동적 글 목록 컨테이너 -->
        <nav class="flex-grow overflow-y-auto custom-scrollbar py-2" id="sidebar-menu"></nav>

        <!-- 제휴 및 문의 버튼 -->
        <div class="px-4 py-3 border-t border-white/[.06] flex items-center gap-2">
            <button onclick="openB2BModal()" class="flex-grow h-9 rounded-lg text-[11px] font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:opacity-95 transition-all shadow-md">💬 제휴 및 B2B 문의</button>
        </div>
        <p class="text-center t-caption py-2.5 border-t border-white/[0.04]">Since 2024 머니대디</p>
    </aside>

    <!-- 모바일 하단 탭 네비게이션 -->
    <nav class="lg:hidden fixed bottom-0 left-0 right-0 h-16 bg-[#0a0e17]/95 backdrop-blur-xl border-t border-white/[.06] grid grid-cols-3 z-40" aria-label="모바일 탐색">
        <button onclick="switchCategory('macro');closeDrawer()" id="mob-tab-macro" class="mob-tab flex flex-col items-center justify-center gap-0.5 text-slate-500 hover:text-white transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 12l3-3 3 3 4-4M3 4h18v2H3z"/></svg>
            <span class="text-[10px] font-semibold">거시금융</span>
        </button>
        <button onclick="switchCategory('tech');closeDrawer()" id="mob-tab-tech" class="mob-tab flex flex-col items-center justify-center gap-0.5 text-slate-500 hover:text-white transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            <span class="text-[10px] font-semibold">테크·ETF</span>
        </button>
        <button onclick="switchCategory('essay');closeDrawer()" id="mob-tab-essay" class="mob-tab flex flex-col items-center justify-center gap-0.5 text-slate-500 hover:text-white transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            <span class="text-[10px] font-semibold">백과·에세이</span>
        </button>
    </nav>

    <!-- 메인 컨텐츠 영역 (리포트, 대시보드 동적 렌더링) -->
    <main class="flex-grow overflow-y-auto h-full lg:h-screen custom-scrollbar bg-[var(--md-bg-base)]" id="main-content">
        <!-- Dynamic Content / Dashboards Injected here -->
    </main>

    <!-- B2B Solutions 문의 모달 -->
    <div id="b2b-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="bg-[#0f172a] border border-white/10 rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col">
            <!-- Header -->
            <div class="px-6 py-5 border-b border-white/10 flex justify-between items-center bg-[#0d111f]">
                <div class="flex items-center gap-2">
                    <span class="w-6 h-6 bg-blue-600 rounded flex items-center justify-center text-white text-xs font-bold shadow-lg shadow-blue-500/20">B</span>
                    <h3 class="font-extrabold text-white text-base">B2B / 제휴 문의</h3>
                </div>
                <button onclick="closeB2BModal()" class="text-slate-400 hover:text-white p-1 rounded-lg transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <!-- Form Body -->
            <form onsubmit="submitB2BForm(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">회사명 / 기관명</label>
                    <input type="text" required class="w-full bg-slate-900/60 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="예: 머니대디 파이낸스">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">담당자 성함</label>
                        <input type="text" required class="w-full bg-slate-900/60 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="홍길동">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">연락처</label>
                        <input type="tel" required class="w-full bg-slate-900/60 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="010-0000-0000">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">이메일 주소</label>
                    <input type="email" required class="w-full bg-slate-900/60 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="partner@company.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1.5 uppercase tracking-wider">문의 상세 내용</label>
                    <textarea required rows="4" class="w-full bg-slate-900/60 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors resize-none" placeholder="문의하실 솔루션 및 세부 사항을 적어주세요."></textarea>
                </div>
                <div class="pt-2">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm py-3 rounded-xl transition-all shadow-lg shadow-blue-500/20 active:scale-[0.99]">
                        제출하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- API Access 알림 모달 -->
    <div id="api-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="bg-[#0f172a] border border-white/10 rounded-3xl max-w-md w-full overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300 p-6 text-center">
            <div class="w-16 h-16 bg-amber-500/20 border border-amber-500/30 rounded-full flex items-center justify-center mx-auto mb-4 text-amber-400">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            </div>
            <h3 class="text-xl font-bold text-white mb-2">API Access 제한 안내</h3>
            <p class="text-xs text-slate-300 mb-6 leading-relaxed">
                API Access는 엔터프라이즈 전용 베타로 제공됩니다.<br>
                일반 사용자의 접근이 제한되어 있습니다. 상세한 API 제휴 및 데이터 연동이 필요한 경우 B2B Solutions 문의를 이용해 주세요.
            </p>
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <button onclick="closeApiModal(); openB2BModal();" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm px-6 py-2.5 rounded-xl transition-all shadow-lg shadow-blue-500/20">B2B 문의하기</button>
                <button onclick="closeApiModal()" class="bg-white/10 hover:bg-white/20 text-white font-bold text-sm px-6 py-2.5 rounded-xl border border-white/10 transition-all">확인</button>
            </div>
        </div>
    </div>

    <!-- 애플리케이션 자바스크립트 모듈 로드 -->
    <script src="js/report-templates.js"></script>
    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/report-loader.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
